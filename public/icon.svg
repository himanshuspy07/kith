<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5B3FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB5A7;stop-opacity:1" />
    </linearGradient>
    <filter id="clayFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset in="blur" dx="8" dy="8" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="8" specularConstant="1" specularExponent="30" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <!-- Bubble Body -->
  <path d="M256 170C185 170 130 225 130 300C130 375 185 430 256 430C327 430 382 375 382 300C382 225 327 170 256 170Z" fill="#8CFFD1" filter="url(#clayFilter)"/>
  <!-- K Antennae -->
  <path d="M225 90V160M225 125L265 90M225 125L265 160" stroke="#B194FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M285 90V160M285 125L325 90M285 125L325 160" stroke="#FFB5A7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Face -->
  <circle cx="210" cy="290" r="10" fill="#5A4B81" />
  <circle cx="302" cy="290" r="10" fill="#5A4B81" />
  <path d="M245 335C245 335 256 345 267 335" stroke="#5A4B81" stroke-width="6" stroke-linecap="round" />
</svg>